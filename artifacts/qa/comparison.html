<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control Dashboard Designvergleich</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px;
      color: #f7f0df;
      background: #090a0c;
      font: 15px/1.45 Georgia, serif;
    }
    h1 { margin: 0 0 20px; color: #f5c84c; }
    .comparison { display: grid; gap: 24px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    figure {
      margin: 0;
      padding: 12px;
      border: 1px solid rgba(245, 200, 76, 0.28);
      border-radius: 14px;
      background: #15161b;
    }
    figcaption { margin-bottom: 10px; color: #f5c84c; letter-spacing: 0.06em; }
    img {
      display: block;
      width: 100%;
      height: 520px;
      object-fit: contain;
      object-position: top center;
      background: #050608;
    }
  </style>
</head>
<body>
  <h1>Control Dashboard: Referenz und Umsetzung</h1>
  <main class="comparison">
    <section class="row">
      <figure>
        <figcaption>Referenz: Routing und Kontrollzentrum</figcaption>
        <img src="reference-dashboard-1.jpg" alt="Vom Nutzer gelieferte Routing-Referenz">
      </figure>
      <figure>
        <figcaption>Umsetzung: getrennte Live Routing Map</figcaption>
        <img src="control-agentsroom-1440-final.jpg" alt="Implementierte AgentsRoom Ansicht">
      </figure>
    </section>
    <section class="row">
      <figure>
        <figcaption>Referenz: farbige Systemmetriken</figcaption>
        <img src="reference-dashboard-4.jpg" alt="Vom Nutzer gelieferte Metrik-Referenz">
      </figure>
      <figure>
        <figcaption>Umsetzung: Live Kontrolle und KPI-Ring</figcaption>
        <img src="control-overview-1440.png" alt="Implementierte Kontrolluebersicht">
      </figure>
    </section>
  </main>
</body>
</html>
